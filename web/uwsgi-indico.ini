[uwsgi]
processes = 4
enable-threads = true
http-socket = 0.0.0.0:9090
protocol = http

master = true
auto-procname = true
procname-prefix-spaced = indico
disable-logging = true

;plugin = python
single-interpreter = true

touch-reload = /indico/indico.wsgi
wsgi-file = /indico/indico.wsgi

ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

vacuum = true
memory-report = true
max-requests = 2500
harakiri = 900
harakiri-verbose = true
reload-on-rss = 2048
evil-reload-on-rss = 8192

offload-threads = 4
