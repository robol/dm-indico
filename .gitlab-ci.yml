image: docker:latest

variables:
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:stable-dind

before_script:
  - docker info

build_image:
  script:
    - cd web
    - docker build -t robol/indico-web .
    - test -z $CI_COMMIT_TAG || docker tag robol/indico-web robol/indico-web:$CI_COMMIT_TAG
    - test -z $CI_COMMIT_BRANCH || docker tag robol/indico-web robol/indico-web:$CI_COMMIT_BRANCH
    - docker login -u robol -p "${DOCKERHUB_ROBOL_TOKEN}"
    - docker push --all-tags robol/indico-web
    - docker image rm robol/indico-web
