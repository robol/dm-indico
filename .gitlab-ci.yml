image: docker:latest

variables:
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:stable-dind

before_script:
  - docker info

build_image:
  script:
    - docker login -u "${HARBOR_USERNAME}" -p "${HARBOR_PASSWORD}" harbor.cs.dm.unipi.it
    - cd web
    - docker build -t harbor.cs.dm.unipi.it/indico-web/indico-web .
    - test -z $CI_COMMIT_TAG || docker tag harbor.cs.dm.unipi.it/indico-web/indico-web harbor.cs.dm.unipi.it/indico-web/indico-web:$CI_COMMIT_TAG
    - test -z $CI_COMMIT_BRANCH || docker tag harbor.cs.dm.unipi.it/indico-web/indico-web harbor.cs.dm.unipi.it/indico-web/indico-web:$CI_COMMIT_BRANCH
    - docker push --all-tags harbor.cs.dm.unipi.it/indico-web/indico-web
    - docker image rm harbor.cs.dm.unipi.it/indico-web/indico-web
